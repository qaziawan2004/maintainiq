<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaintainIQ - Login</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #ec4899;
            --success: #22c55e;
            --warning: #eab308;
            --danger: #ef4444;
            --bg-start: #0f0c29;
            --bg-mid: #302b63;
            --bg-end: #24243e;
            --card-bg: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.8);
            --text-muted: rgba(255, 255, 255, 0.5);
            --input-bg: rgba(255, 255, 255, 0.06);
            --input-border: rgba(255, 255, 255, 0.12);
            --input-focus: rgba(99, 102, 241, 0.3);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] {
            --bg-start: #f0f4ff;
            --bg-mid: #dbeafe;
            --bg-end: #ede9fe;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(99, 102, 241, 0.2);
            --text-primary: #1e293b;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.9);
            --input-border: #e2e8f0;
            --input-focus: rgba(99, 102, 241, 0.2);
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(99, 102, 241, 0.15);
        }

        html, body {
            height: 100%;
            overflow-y: auto;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
            transition: background 0.5s ease;
            position: relative;
            overflow-y: auto;
        }

        /* Animated Background */
        body::before {
            content: '';
            position: fixed;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -200px;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            bottom: -100px;
            left: -100px;
            animation: float 25s ease-in-out infinite reverse;
            pointer-events: none;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: particleFloat linear infinite;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) rotate(720deg);
                opacity: 0;
            }
        }

        .auth-container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
            margin: auto;
        }

        .auth-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            position: relative;
            overflow: visible;
            max-height: none;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, var(--primary), var(--accent), var(--secondary));
            opacity: 0.8;
            border-radius: 24px 24px 0 0;
        }

        /* Theme Toggle */
        .theme-toggle {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            z-index: 10;
        }

        .theme-toggle button {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 1px solid var(--card-border);
            background: var(--glass-bg);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
        }

        .theme-toggle button:hover {
            transform: scale(1.1);
            border-color: var(--primary);
            background: var(--input-focus);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
            padding-right: 3rem;
        }

        .auth-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .auth-logo i {
            font-size: 2rem;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-logo span {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
        }

        .auth-header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Tabs */
        .auth-tabs {
            display: flex;
            gap: 0.5rem;
            background: var(--glass-bg);
            padding: 0.25rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            border: 1px solid var(--glass-border);
        }

        .auth-tab {
            flex: 1;
            padding: 0.625rem;
            border: none;
            border-radius: 8px;
            background: transparent;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .auth-tab.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .auth-tab:hover:not(.active) {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .auth-form {
            display: none;
            animation: fadeSlide 0.4s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            margin-bottom: 0.375rem;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .input-group:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px var(--input-focus);
        }

        .input-group .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            font-size: 0.9rem;
            pointer-events: none;
        }

        .input-group input {
            width: 100%;
            padding: 0.75rem 0.75rem 0.75rem 2.75rem;
            border: none;
            background: transparent;
            font-size: 0.95rem;
            color: var(--text-primary);
            font-family: inherit;
            outline: none;
        }

        .input-group input::placeholder {
            color: var(--text-muted);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .toggle-password:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .form-group small {
            color: var(--text-muted);
            font-size: 0.75rem;
            display: block;
            margin-top: 0.25rem;
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 0.875rem;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(99, 102, 241, 0.5);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .auth-footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .auth-footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .auth-footer a:hover {
            color: var(--accent);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.8rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--input-border);
        }

        /* Status Bar */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1.25rem;
            background: var(--glass-bg);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            margin-top: 1.5rem;
            font-size: 0.8rem;
            color: var(--text-secondary);
            backdrop-filter: blur(10px);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .status-bar .time {
            font-weight: 600;
            color: var(--text-primary);
        }

        .status-bar .weather {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .status-bar .weather i {
            color: var(--warning);
        }

        /* Toast Container */
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 350px;
            width: 100%;
        }

        .toast {
            padding: 1rem 1.25rem;
            border-radius: 12px;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            box-shadow: var(--shadow);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.success { border-left: 4px solid var(--success); }
        .toast.error { border-left: 4px solid var(--danger); }
        .toast.warning { border-left: 4px solid var(--warning); }
        .toast.info { border-left: 4px solid var(--primary); }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(100px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* Responsive */
        @media (max-width: 480px) {
            body {
                padding: 1rem 0.5rem;
                align-items: flex-start;
                padding-top: 2rem;
            }

            .auth-card {
                padding: 1.5rem;
                border-radius: 16px;
                margin: 0.5rem;
            }

            .auth-header {
                padding-right: 2.5rem;
            }

            .auth-header h2 {
                font-size: 1.3rem;
            }

            .auth-header p {
                font-size: 0.85rem;
            }

            .status-bar {
                flex-wrap: wrap;
                gap: 0.5rem;
                justify-content: center;
                font-size: 0.7rem;
                padding: 0.5rem 1rem;
            }

            .theme-toggle {
                top: 1rem;
                right: 1rem;
            }

            .theme-toggle button {
                width: 34px;
                height: 34px;
                font-size: 0.9rem;
            }

            .auth-tabs {
                margin-bottom: 1.5rem;
            }

            .auth-tab {
                font-size: 0.8rem;
                padding: 0.5rem;
            }

            .form-group {
                margin-bottom: 1rem;
            }

            .input-group input {
                padding: 0.625rem 0.625rem 0.625rem 2.5rem;
                font-size: 0.9rem;
            }

            .btn-primary {
                padding: 0.75rem;
                font-size: 0.9rem;
            }

            .divider {
                margin: 1rem 0;
                font-size: 0.7rem;
            }
        }

        @media (max-height: 700px) {
            body {
                padding: 1rem 0.5rem;
                align-items: flex-start;
                padding-top: 1rem;
            }

            .auth-card {
                padding: 1.25rem;
            }

            .auth-header {
                margin-bottom: 1rem;
            }

            .auth-header h2 {
                font-size: 1.2rem;
            }

            .auth-header p {
                font-size: 0.8rem;
            }

            .form-group {
                margin-bottom: 0.75rem;
            }

            .auth-tabs {
                margin-bottom: 1rem;
                padding: 0.2rem;
            }

            .auth-tab {
                padding: 0.4rem;
                font-size: 0.8rem;
            }

            .status-bar {
                margin-top: 1rem;
                padding: 0.5rem 1rem;
            }
        }

        @media (max-height: 600px) {
            .auth-card {
                padding: 1rem;
            }

            .auth-header {
                margin-bottom: 0.75rem;
            }

            .auth-header .auth-logo {
                margin-bottom: 0.5rem;
            }

            .auth-header h2 {
                font-size: 1rem;
            }

            .form-group {
                margin-bottom: 0.5rem;
            }

            .input-group input {
                padding: 0.5rem 0.5rem 0.5rem 2.25rem;
                font-size: 0.85rem;
            }

            .btn-primary {
                padding: 0.6rem;
                font-size: 0.85rem;
            }

            .divider {
                margin: 0.75rem 0;
            }

            .status-bar {
                margin-top: 0.75rem;
                padding: 0.4rem 0.75rem;
                font-size: 0.65rem;
            }
        }

        /* Loading State */
        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            right: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Particles Background -->
    <div class="particles" id="particles"></div>

    <div class="auth-container">
        <div class="auth-card">
            <!-- Theme Toggle -->
            <div class="theme-toggle">
                <button id="themeToggle" title="Toggle Theme">
                    <i class="fas fa-moon"></i>
                </button>
            </div>

            <!-- Header -->
            <div class="auth-header">
                <div class="auth-logo">
                    <i class="fas fa-microchip"></i>
                    <span>MaintainIQ</span>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to manage your assets and maintenance</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button class="auth-tab active" data-tab="login">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
                <button class="auth-tab" data-tab="signup">
                    <i class="fas fa-user-plus"></i> Sign Up
                </button>
            </div>

            <!-- Login Form -->
            <form id="loginForm" class="auth-form active">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" placeholder="Enter your email" required />
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" placeholder="Enter your password" required />
                        <button type="button" class="toggle-password" onclick="togglePassword('loginPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn">
                    <i class="fas fa-sign-in-alt"></i> Sign In
                </button>
                <div class="auth-footer">
                    <p>Don't have an account? <a href="#" onclick="switchTab('signup')">Sign Up</a></p>
                </div>
            </form>

            <!-- Signup Form -->
            <form id="signupForm" class="auth-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="input-group">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" id="signupName" placeholder="Enter your full name" required />
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-group">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" id="signupEmail" placeholder="Enter your email" required />
                    </div>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signupPassword" placeholder="Create a password" required />
                        <button type="button" class="toggle-password" onclick="togglePassword('signupPassword', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <small>Password must be at least 6 characters</small>
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <div class="input-group">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="signupConfirm" placeholder="Confirm your password" required />
                        <button type="button" class="toggle-password" onclick="togglePassword('signupConfirm', this)">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="signupBtn">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <div class="auth-footer">
                    <p>Already have an account? <a href="#" onclick="switchTab('login')">Sign In</a></p>
                </div>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Demo Account -->
            <button class="btn-primary" style="background: linear-gradient(135deg, var(--success), #059669);" onclick="demoLogin()">
                <i class="fas fa-rocket"></i> Try Demo Account
            </button>

            <!-- Status Bar -->
            <div class="status-bar">
                <div class="weather">
                    <i class="fas fa-cloud-sun"></i>
                    <span>29°C Mostly clear</span>
                </div>
                <div class="time" id="currentTime">
                    <i class="far fa-clock"></i>
                    <span>04:41 AM</span>
                </div>
                <div>
                    <i class="far fa-calendar-alt"></i>
                    <span id="currentDate">12-Jul-26</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============ PARTICLES ============
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                const size = Math.random() * 4 + 2;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDuration = (Math.random() * 20 + 15) + 's';
                particle.style.animationDelay = (Math.random() * 20) + 's';
                container.appendChild(particle);
            }
        }
        createParticles();

        // ============ THEME TOGGLE ============
        let currentTheme = 'dark';
        
        document.getElementById('themeToggle').addEventListener('click', function() {
            const icon = this.querySelector('i');
            if (currentTheme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'light');
                icon.className = 'fas fa-sun';
                currentTheme = 'light';
            } else {
                document.documentElement.removeAttribute('data-theme');
                icon.className = 'fas fa-moon';
                currentTheme = 'dark';
            }
            localStorage.setItem('theme', currentTheme);
        });

        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            document.querySelector('#themeToggle i').className = 'fas fa-sun';
            currentTheme = 'light';
        }

        // ============ PASSWORD TOGGLE ============
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);
            const icon = button.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                input.type = 'password';
                icon.className = 'fas fa-eye';
            }
        }

        // ============ TAB SWITCHING ============
        function switchTab(tab) {
            document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.auth-form').forEach(f => f.classList.remove('active'));
            
            document.querySelector(`.auth-tab[data-tab="${tab}"]`).classList.add('active');
            document.getElementById(`${tab}Form`).classList.add('active');
            
            document.querySelectorAll('.auth-form').forEach(f => f.reset());
            
            // Scroll to top of card when switching tabs
            document.querySelector('.auth-card').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.querySelectorAll('.auth-tab').forEach(tab => {
            tab.addEventListener('click', function() {
                switchTab(this.dataset.tab);
            });
        });

        // ============ TOAST ============
        function showToast(message, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icons = {
                success: 'fa-check-circle',
                error: 'fa-exclamation-circle',
                warning: 'fa-exclamation-triangle',
                info: 'fa-info-circle'
            };
            
            toast.innerHTML = `
                <i class="fas ${icons[type] || icons.info}"></i>
                <span>${message}</span>
            `;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(100px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ============ DEMO LOGIN ============
        function demoLogin() {
            const users = JSON.parse(localStorage.getItem('maintainiq_users') || '[]');
            
            let demoUser = users.find(u => u.email === 'demo@maintainiq.com');
            
            if (!demoUser) {
                users.push({
                    id: 'demo_' + Date.now(),
                    name: 'Demo User',
                    email: 'demo@maintainiq.com',
                    password: 'demo123',
                    createdAt: new Date().toISOString()
                });
                localStorage.setItem('maintainiq_users', JSON.stringify(users));
                demoUser = users[users.length - 1];
            }
            
            localStorage.setItem('maintainiq_current_user', JSON.stringify(demoUser));
            showToast('Welcome Demo User! Redirecting...', 'success');
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 1000);
        }

        // ============ LOGIN ============
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.classList.add('loading');
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            const users = JSON.parse(localStorage.getItem('maintainiq_users') || '[]');
            const user = users.find(u => u.email === email && u.password === password);
            
            setTimeout(() => {
                btn.classList.remove('loading');
                if (user) {
                    localStorage.setItem('maintainiq_current_user', JSON.stringify(user));
                    showToast('Welcome back, ' + user.name + '!', 'success');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 500);
                } else {
                    showToast('Invalid email or password. Please try again.', 'error');
                }
            }, 800);
        });

        // ============ SIGNUP ============
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            btn.classList.add('loading');
            
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPassword').value;
            const confirm = document.getElementById('signupConfirm').value;
            
            setTimeout(() => {
                btn.classList.remove('loading');
                
                if (password !== confirm) {
                    showToast('Passwords do not match!', 'error');
                    return;
                }
                
                if (password.length < 6) {
                    showToast('Password must be at least 6 characters!', 'error');
                    return;
                }
                
                const users = JSON.parse(localStorage.getItem('maintainiq_users') || '[]');
                
                if (users.find(u => u.email === email)) {
                    showToast('User with this email already exists!', 'error');
                    return;
                }
                
                const newUser = {
                    id: 'user_' + Date.now(),
                    name: name,
                    email: email,
                    password: password,
                    createdAt: new Date().toISOString()
                };
                
                users.push(newUser);
                localStorage.setItem('maintainiq_users', JSON.stringify(users));
                localStorage.setItem('maintainiq_current_user', JSON.stringify(newUser));
                
                showToast('Account created successfully!', 'success');
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 500);
            }, 800);
        });

        // ============ CLOCK ============
        function updateClock() {
            const now = new Date();
            const time = now.toLocaleTimeString('en-US', { 
                hour: '2-digit', 
                minute: '2-digit',
                hour12: true 
            });
            const date = now.toLocaleDateString('en-US', {
                day: '2-digit',
                month: 'short',
                year: '2-digit'
            });
            
            document.querySelector('#currentTime span').textContent = time;
            document.getElementById('currentDate').textContent = date;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // ============ KEYBOARD SHORTCUTS ============
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key === 'D') {
                e.preventDefault();
                demoLogin();
            }
        });

        // ============ PREVENT FORM RESUBMISSION ============
        if (window.history.replaceState) {
            window.history.replaceState(null, null, window.location.href);
        }
    </script>
</body>
</html>
